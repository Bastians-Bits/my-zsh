- name: Install Powerlevel10k
  hosts: localhost
  vars_prompt:
    - name: special_character
      prompt: Install Powerlevel10k with Special Character? (Blank to Confirm)
      private: false
  tasks:
  #############################################################################
  # Powerlevel10k
  #############################################################################
  - name: Delete p10k configuration
    ansible.builtin.file:
      state: absent
      path: "{{ ansible_env.HOME }}/.p10k.zsh"

  - name: Copy p10k configuration (with special character)
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../files/.p10k.zsh"
      dest: "{{ ansible_env.HOME }}/.p10k.zsh"
    when: special_character == ""

  - name: Copy p10k configuration (without special character)
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../files/.p10k.zsh.simplified"
      dest: "{{ ansible_env.HOME }}/.p10k.zsh"
    when: special_character != ""

  - name: Checkout p10k
    ansible.builtin.git:
      repo: "https://github.com/romkatv/powerlevel10k.git"
      dest: "{{ ansible_env.HOME }}/.oh-my-zsh/custom/themes/powerlevel10k"
      depth: 1

  - name: Set p10k as theme
    ansible.builtin.lineinfile:
      path: "{{ ansible_env.HOME }}/.zshrc"
      regexp: '^ZSH_THEME='
      line: ZSH_THEME="powerlevel10k/powerlevel10k"

  - name: Add p10k to zshrc (1)
    ansible.builtin.lineinfile:
      path: "{{ ansible_env.HOME }}/.zshrc"
      insertbefore: BOF
      line: |
        # Enable Powerlevel10k instant prompt. Should stay close to the top of ~/.zshrc.
        # Initialization code that may require console input (password prompts, [y/n]
        # confirmations, etc.) must go above this block; everything else may go below.
        if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
          source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
        fi
  
  - name: Add p10k to zshrc (2)
    ansible.builtin.lineinfile:
      path: "{{ ansible_env.HOME }}/.zshrc"
      insertafter: EOF
      line: |
        # To customize prompt, run `p10k configure` or edit ~/.p10k.zsh.
        [[ ! -f ~/.p10k.zsh ]] || source ~/.p10k.zsh
