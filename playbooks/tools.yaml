- name: Install shell tools
  hosts: localhost
  tasks:
  #############################################################################
  # Tools
  #############################################################################
  - name: Install eza
    become: true 
    ansible.builtin.package:
      name: eza
      state: present
 
  - name: Install bat
    become: true 
    ansible.builtin.package:
      name: bat
      state: present
  
  - name: Get Desktop Environment
    ansible.builtin.shell: "echo $XDG_CURRENT_DESKTOP"
    register: desktop_environment

  - name: Install kitty
    become: true 
    ansible.builtin.package:
      name: kitty
      state: present
    when: desktop_environment.stdout != ""

  - name: Install fuzzy search
    become: true 
    ansible.builtin.package:
      name: fzf
      state: present
  
  - name: Install ripgrep
    become: true
    ansible.builtin.package:
      name: ripgrep
      state: present
